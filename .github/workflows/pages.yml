name: Deploy dashboard to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Find and assemble the dashboard
        run: |
          set -e
          DIR=""
          for c in dashboard reports docs site public .; do
            if [ -f "$c/index.html" ]; then DIR="$c"; break; fi
          done
          if [ -z "$DIR" ]; then
            F=$(find . -name '*.html' -not -path './.git/*' | head -n 1)
            if [ -z "$F" ]; then echo "no html file in this repository"; exit 1; fi
            DIR=$(dirname "$F")
          fi
          echo "publishing folder: $DIR"
          mkdir -p _site
          rsync -a --exclude '_site' --exclude '.git' "$DIR"/ _site/
          if [ ! -f _site/index.html ]; then
            FIRST=$(ls _site/*.html | head -n 1)
            echo "using $FIRST as index.html"
            cp "$FIRST" _site/index.html
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
